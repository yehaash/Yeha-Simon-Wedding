<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeha & Simon Wedding</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
            background: #fff; color: #1a1a1a;
            line-height: 1.5; word-break: keep-all;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .reveal {
            opacity: 0;
            transform: translateY(25px);
            transition: all 1.2s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .reveal.active { opacity: 1; transform: translateY(0); }

        section { text-align: center; }

        /* 1. 상단 정보 */
        .hero-section { padding: 70px 24px 45px; }
        .hero-text { font-size: 0.82rem; font-weight: 400; color: #666; letter-spacing: 0.02rem; line-height: 1.7; }
        .hero-text b { font-weight: 600; color: #1a1a1a; display: block; font-size: 0.88rem; margin-top: 3px; }
        .hero-text .eng-sub { font-size: 0.72rem; color: #aaa; text-transform: uppercase; margin-top: 5px; display: block; letter-spacing: 0.05rem; }

        /* 이미지 공통 */
        .img-wrap { width: 100%; overflow: hidden; display: block; line-height: 0; text-align: center; }
        .img-wrap img { width: 100%; height: auto; display: inline-block; }

        /* 2. 인사말 */
        .greeting-section { padding: 35px 28px 85px; }
        .main-message { font-size: 1.05rem; font-weight: 400; }
        .main-message .sub-text { font-size: 0.82rem; color: #888; margin-top: 18px; display: block; line-height: 1.5; font-weight: 300; }

        /* 3. 삽화 섹션 (원화 질감 유지 및 크기 조정) */
        .illust-section { padding: 0; background: #fff; }
        /* 첫 번째, 두 번째 삽화(한 장의 원화) 폭 조정 */
        .split-illust img { width: 85%; margin: 0 auto; } 
        /* 세 번째 삽화 폭 조정 */
        .illust-item-3 img { width: 95%; margin: 0 auto; }

        /* 4. 성함 및 연락처 섹션 (삽화 하단으로 이동 및 정돈) */
        .names-section { padding: 60px 28px 90px; background: #fff; border-bottom: 1px solid #f5f5f5; }
        .names-list { font-size: 0.98rem; line-height: 2.3; margin-top: 20px; }
        .names-list b { font-weight: 600; }
        
        .contact-btn {
            display: inline-block; padding: 5px 12px; margin-left: 8px;
            border: 1px solid #e2e2e2; background: #fff; font-size: 0.75rem;
            color: #555; text-decoration: none; cursor: pointer; border-radius: 3px;
            transition: 0.2s; vertical-align: middle;
        }
        .contact-btn:active { background: #f9f9f9; border-color: #000; color: #000; }

        /* 5. 계좌 정보 섹션 */
        .account-section { padding: 80px 28px 100px; background: #fafafa; }
        .account-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 35px; letter-spacing: 0.05rem; color: #333; text-transform: uppercase;}
        .account-box { margin-bottom: 15px; }
        .copy-btn { 
            display: inline-block; width: 100%; max-width: 280px; padding: 15px 0; 
            border: 1px solid #e2e2e2; background: #fff; font-size: 0.8rem; 
            color: #555; cursor: pointer; transition: 0.2s; border-radius: 3px;
        }
        .copy-btn:active { background: #f9f9f9; border-color: #000; color: #000; }

        /* 6. 위치 정보 및 API 지도 */
        .location-section { background: #fff; padding: 110px 24px; border-top: 1px solid #f5f5f5; }
        .address-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 8px; }
        .address-detail { font-size: 0.92rem; color: #555; margin-bottom: 35px; }
        #kakao-map { width: 100%; height: 380px; background: #eee; margin-bottom: 25px; border: 1px solid #ddd; }
        
        .map-btn { 
            display: inline-block; width: 100%; max-width: 300px; padding: 14px 0; border: 1px solid #000; 
            font-size: 0.8rem; font-weight: 500; text-decoration: none; color: #000;
        }
    </style>
</head>
<body>

    <section class="hero-section reveal">
        <div class="hero-text">
            2026. 04. 25 13:00
            <b>영종도 네스트 호텔</b>
            <span class="eng-sub">Nest Hotel Yeongjongdo</span>
        </div>
    </section>

    <div class="img-wrap reveal">
        <img src="https://cdn.imweb.me/upload/S2026030268996512d33da/9865370a4da49.jpg" alt="Main Photo">
    </div>

    <section class="greeting-section reveal">
        <div class="main-message">
            예하와 사이먼 결혼합니다.<br>함께 축하해주세요.
            <span class="sub-text">Yeha and Simon are getting married.<br>Come and celebrate!</span>
        </div>
    </section>

    <section class="illust-section">
        <div class="img-wrap reveal split-illust"><img src="https://sp-ao.shortpixel.ai/client/to_webp,q_glossy,ret_img,w_1024/https://yehasimon.com/wp-content/uploads/2024/01/illust1.png" alt="Illust 1"></div>
        <div class="img-wrap reveal split-illust"><img src="https://sp-ao.shortpixel.ai/client/to_webp,q_glossy,ret_img,w_1024/https://yehasimon.com/wp-content/uploads/2024/01/illust2.png" alt="Illust 2"></div>
        
        <div class="img-wrap reveal illust-item-3"><img src="https://sp-ao.shortpixel.ai/client/to_webp,q_glossy,ret_img,w_1024/https://yehasimon.com/wp-content/uploads/2024/01/illust3.png" alt="Illust 3"></div>
        
        <div class="img-wrap reveal"><img src="https://cdn.imweb.me/upload/S2026030268996512d33da/fc9676d61171d.png" alt="Illust 4"></div>
    </section>

    <section class="names-section reveal">
        <div class="names-list">
            박해도 · 이상희의 딸 <b>박예하</b>
            <a href="tel:010-0000-0000" class="contact-btn">CALL</a>
            <br>
            故 크리스토퍼 졸리 · 파멜라 졸리의 아들<br><b>사이먼 크리스토퍼 졸리 윌슨</b>
            <a href="tel:010-0000-0000" class="contact-btn">CALL</a>
        </div>
    </section>

    <section class="account-section reveal">
        <div class="account-title">Gifts</div>
        <div class="account-box">
            <button class="copy-btn" onclick="copyText('신한은행 110-000-000000 (박예하)')">신부측 계좌번호 복사</button>
        </div>
        <div class="account-box">
            <button class="copy-btn" onclick="copyText('국민은행 000000-00-000000 (사이먼)')">신랑측 계좌번호 복사</button>
        </div>
    </section>

    <section class="location-section reveal">
        <div class="address-title">Nest Hotel Yeongjongdo</div>
        <div class="address-detail">인천광역시 중구 영종해안남로 19-5</div>
        <div id="kakao-map"></div>
        <div class="map-buttons"><a href="https://map.kakao.com/link/to/네스트호텔,37.4249727,126.4280671" target="_blank" class="map-btn">KAKAOMAP</a></div>
    </section>

    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=872a9e4cacb2f851e200d1e1629bb297"></script>
    <script>
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('active'); });
        }, { threshold: 0.12 });
        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

        var mapContainer = document.getElementById('kakao-map'), 
            mapOption = { center: new kakao.maps.LatLng(37.4249727, 126.4280671), level: 3 }; 
        var map = new kakao.maps.Map(mapContainer, mapOption); 
        var marker = new kakao.maps.Marker({ position: new kakao.maps.LatLng(37.4249727, 126.4280671) });
        marker.setMap(map);
        map.setZoomable(false);

        function copyText(val) {
            navigator.clipboard.writeText(val).then(() => { alert('계좌번호가 복사되었습니다.'); });
        }
    </script>
</body>
</html>
